name: Q1 global mobility pilot

concurrency:
  group: q1-global-mobility-pilot
  cancel-in-progress: true

on:
  push:
    branches:
      - pilot-q1-global-mobility
    paths:
      - "pilot_q1/**"
      - ".github/workflows/q1-global-mobility-pilot.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::stringr
            any::tidyr
      - name: Download UNESCO UIS OPRI CSV
        run: |
          curl -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            "https://data.unesco.org/api/explore/v2.1/catalog/datasets/uis006/exports/csv?lang=en&timezone=UTC&use_labels_for_header=false&csv_separator=%2C" \
            -o pilot_q1/uis006.csv
          ls -lh pilot_q1/uis006.csv
      - name: Run UIS feasibility audit
        run: Rscript pilot_q1/01_audit_uis_bilateral.R
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-global-mobility-pilot
          path: pilot_q1/output
          retention-days: 14
