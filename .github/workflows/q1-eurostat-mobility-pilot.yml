name: Q1 Eurostat mobility pilot

concurrency:
  group: q1-eurostat-mobility-pilot
  cancel-in-progress: true

on:
  push:
    branches:
      - pilot-q1-global-mobility
    paths:
      - "pilot_q1/03_audit_eurostat_bilateral.R"
      - "pilot_q1/04_audit_eurostat_matrix.R"
      - "pilot_q1/05_audit_eurostat_quality.R"
      - "pilot_q1/06_build_analysis_panel.R"
      - "pilot_q1/design-freeze.md"
      - ".github/workflows/q1-eurostat-mobility-pilot.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::stringr
      - name: Download Eurostat UOE mobility SDMX-CSV
        run: |
          curl -L --fail --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/educ_uoe_mobs02?format=SDMX-CSV" \
            -o pilot_q1/eurostat_mobs02.csv
          ls -lh pilot_q1/eurostat_mobs02.csv
          head -n 2 pilot_q1/eurostat_mobs02.csv
      - name: Run Eurostat feasibility audit
        run: Rscript pilot_q1/03_audit_eurostat_bilateral.R
      - name: Run deep Eurostat matrix audit
        run: Rscript pilot_q1/04_audit_eurostat_matrix.R
      - name: Run Eurostat matrix quality audit
        run: Rscript pilot_q1/05_audit_eurostat_quality.R
      - name: Build frozen analysis panel and metrics
        run: Rscript pilot_q1/06_build_analysis_panel.R
      - name: Upload Eurostat audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-eurostat-mobility-pilot
          path: |
            pilot_q1/eurostat_output
            pilot_q1/eurostat_deep
            pilot_q1/eurostat_quality
            pilot_q1/analysis_ready
          retention-days: 14
